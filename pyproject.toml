[project]
name = "market-report-bot"
version = "2.0.0"
description = "Resilient cross-asset morning report delivered to Feishu"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
